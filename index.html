<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Vetra — Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{
  --blue:#1a32cc;--blue-l:#2d47e8;--blue-p:#e8edff;
  --green:#10b981;--green-p:#d1fae5;
  --amber:#f59e0b;--amber-p:#fef3c7;
  --red:#ef4444;--red-p:#fee2e2;
  --purple:#8b5cf6;--purple-p:#ede9fe;
  --cyan:#06b6d4;--cyan-p:#cffafe;
  --pink:#ec4899;--pink-p:#fce7f3;
  --bg:#07091c;--bg2:#0d1135;--bg3:#121848;
  --card:#0f1540;--card2:#151c55;
  --t1:#eef0ff;--t2:#7a85c0;--tm:#3d4880;
  --bor:rgba(80,100,255,.13);--bor2:rgba(80,100,255,.25);
  --sh:0 2px 20px rgba(0,0,0,.45);--sh2:0 12px 48px rgba(0,0,0,.65);
  --r:12px;--r2:8px;
  --sb:240px;--top:56px;
  --font:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
}
[data-theme=light]{
  --bg:#f0f2ff;--bg2:#e4e8ff;--bg3:#d8deff;
  --card:#fff;--card2:#f5f6ff;
  --t1:#0b0f2e;--t2:#4a5280;--tm:#8890bb;
  --bor:rgba(26,50,204,.10);--bor2:rgba(26,50,204,.22);
  --sh:0 2px 20px rgba(26,50,204,.07);--sh2:0 12px 48px rgba(26,50,204,.14);
}
body{font-family:var(--font);background:var(--bg);color:var(--t1);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* ── TOPBAR ── */
.topbar{
  height:var(--top);background:var(--card);border-bottom:1px solid var(--bor);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;position:fixed;top:0;left:0;right:0;z-index:100;flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:.75rem}
.logo-area{display:flex;align-items:center;gap:8px;text-decoration:none}
.lw{width:32px;height:32px;flex-shrink:0}
.lw img{width:32px;height:32px;object-fit:contain;display:block}
.ll{display:none}.ld{display:block}
[data-theme=light] .ll{display:block}[data-theme=light] .ld{display:none}
.logo-name{font-weight:700;font-size:1.05rem;letter-spacing:-.03em;color:var(--t1)}
.topbar-right{display:flex;align-items:center;gap:.6rem}
.icon-btn{
  width:34px;height:34px;border:none;background:var(--bg2);border-radius:var(--r2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--t2);font-size:.9rem;transition:all .2s;flex-shrink:0;
}
.icon-btn:hover{background:var(--bor2);color:var(--t1)}
.theme-tog{
  width:38px;height:20px;background:var(--bg2);border:1.5px solid var(--bor2);
  border-radius:100px;cursor:pointer;position:relative;flex-shrink:0;
}
.theme-tog::after{
  content:'';position:absolute;left:2px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;border-radius:50%;background:var(--blue);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
[data-theme=light] .theme-tog::after{transform:translateY(-50%) translateX(17px)}
.hamburger{
  width:34px;height:34px;border:none;background:transparent;
  cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:6px;
}
.hamburger span{display:block;height:2px;background:var(--t1);border-radius:2px;transition:all .3s}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.page-title{font-weight:700;font-size:.95rem;letter-spacing:-.02em;color:var(--t1)}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - var(--top));margin-top:var(--top)}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sb);flex-shrink:0;background:var(--card);
  border-right:1px solid var(--bor);
  display:flex;flex-direction:column;overflow-y:auto;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:89;backdrop-filter:blur(2px);
}
.nav-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);padding:.9rem 1rem .3rem}
.nav-item{
  display:flex;align-items:center;gap:.65rem;
  padding:.6rem 1rem;margin:1px .4rem;border-radius:var(--r2);
  cursor:pointer;color:var(--t2);font-size:.85rem;font-weight:500;
  border:none;background:none;width:calc(100% - .8rem);text-align:left;transition:all .18s;
}
.nav-item:hover{background:var(--bg2);color:var(--t1)}
.nav-item.active{background:var(--blue);color:#fff}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.8}
.nav-item.active .nav-icon{opacity:1}
.nav-badge{
  margin-left:auto;background:rgba(255,255,255,.2);color:#fff;
  font-size:.62rem;font-weight:700;padding:.1rem .4rem;border-radius:100px;min-width:16px;text-align:center;
}
.nav-item:not(.active) .nav-badge{background:var(--blue);color:#fff}
.sidebar-foot{
  padding:.85rem 1rem;border-top:1px solid var(--bor);margin-top:auto;
  display:flex;align-items:center;justify-content:space-between;
}
.user-chip{display:flex;align-items:center;gap:.5rem}
.user-av{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--blue-l));
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;font-weight:700;color:#fff;flex-shrink:0;
}
.user-name{font-size:.78rem;font-weight:600;color:var(--t1)}
.foot-actions{display:flex;gap:.4rem}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:1.25rem}

/* ── CARDS ── */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:.42rem .9rem;border-radius:var(--r2);
  font-family:var(--font);font-weight:600;font-size:.8rem;
  cursor:pointer;transition:all .2s;border:none;letter-spacing:-.01em;white-space:nowrap;
}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(26,50,204,.3)}
.btn-primary:hover{background:var(--blue-l);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--t2);border:1.5px solid var(--bor2)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#059669}
.btn-sm{padding:.3rem .65rem;font-size:.73rem}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-card{
  background:var(--card);border:1px solid var(--bor);border-radius:var(--r);
  padding:1.2rem;position:relative;overflow:hidden;transition:all .2s;
}
.stat-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2.5px;
  background:linear-gradient(90deg,var(--blue),var(--blue-l));
  transform:scaleX(0);transform-origin:left;transition:transform .3s;
}
.stat-card:hover::after{transform:scaleX(1)}
.stat-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);margin-bottom:.6rem}
.stat-val{font-size:1.8rem;font-weight:700;letter-spacing:-.05em;line-height:1;color:var(--t1)}
.stat-sub{font-size:.72rem;color:var(--t2);margin-top:.3rem}
.stat-ico{position:absolute;top:1rem;right:1rem;width:32px;height:32px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center}
.stat-ico svg{width:16px;height:16px}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.sec-title{font-size:.88rem;font-weight:700;color:var(--t1);letter-spacing:-.02em}

/* ── TABLE ── */
.table-wrap{background:var(--card);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden}
.filters{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.finput{
  padding:.48rem .85rem;background:var(--card);border:1.5px solid var(--bor2);
  border-radius:var(--r2);color:var(--t1);font-family:var(--font);font-size:.82rem;
  outline:none;transition:border-color .2s;min-width:0;
}
.finput:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,50,204,.12)}
.finput::placeholder{color:var(--tm)}
.finput-search{flex:1;min-width:160px}
select.finput{cursor:pointer}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--bor)}
th{padding:.7rem 1rem;text-align:left;font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tm);white-space:nowrap}
td{padding:.75rem 1rem;font-size:.82rem;border-bottom:1px solid var(--bor);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover{background:var(--bg2)}
.td-main{font-weight:600;color:var(--t1);font-size:.85rem}
.td-sub{color:var(--t2);font-size:.75rem;margin-top:1px}
.td-mono{font-family:var(--mono);font-size:.78rem;color:var(--t1);font-weight:500}
.td-muted{font-family:var(--mono);font-size:.72rem;color:var(--tm)}
.row-act{display:flex;gap:.3rem;opacity:0;transition:opacity .15s}
tbody tr:hover .row-act{opacity:1}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .55rem;border-radius:100px;font-size:.68rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.b-lead{background:rgba(107,114,128,.15);color:#9ca3af}
.b-active{background:rgba(16,185,129,.15);color:var(--green)}
.b-review{background:rgba(245,158,11,.15);color:var(--amber)}
.b-done{background:rgba(26,50,204,.15);color:#7b96ff}
.b-paused{background:rgba(239,68,68,.15);color:var(--red)}
.b-overdue{background:rgba(239,68,68,.2);color:var(--red)}
[data-theme=light] .b-lead{background:#f3f4f6;color:#6b7280}
[data-theme=light] .b-active{background:var(--green-p);color:#059669}
[data-theme=light] .b-review{background:var(--amber-p);color:#d97706}
[data-theme=light] .b-done{background:var(--blue-p);color:var(--blue)}
[data-theme=light] .b-paused{background:var(--red-p);color:#dc2626}

.svc-badge{padding:.18rem .5rem;border-radius:100px;font-size:.65rem;font-weight:700;white-space:nowrap}
.sv-site{background:rgba(26,50,204,.18);color:#7b96ff}
.sv-landing{background:rgba(139,92,246,.18);color:#a78bfa}
.sv-social{background:rgba(16,185,129,.18);color:#34d399}
.sv-email{background:rgba(245,158,11,.18);color:#fbbf24}
.sv-ecom{background:rgba(236,72,153,.18);color:#f472b6}
.sv-month{background:rgba(6,182,212,.18);color:#22d3ee}
[data-theme=light] .sv-site{background:var(--blue-p);color:var(--blue)}
[data-theme=light] .sv-landing{background:var(--purple-p);color:var(--purple)}
[data-theme=light] .sv-social{background:var(--green-p);color:#059669}
[data-theme=light] .sv-email{background:var(--amber-p);color:#d97706}
[data-theme=light] .sv-ecom{background:var(--pink-p);color:#db2777}
[data-theme=light] .sv-month{background:var(--cyan-p);color:#0891b2}

.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.p-h{background:var(--red)}.p-m{background:var(--amber)}.p-l{background:var(--green)}

/* ── KANBAN ── */
.kanban{display:flex;gap:1rem;overflow-x:auto;padding-bottom:.5rem;align-items:flex-start}
.kanban::-webkit-scrollbar{height:4px}
.kanban::-webkit-scrollbar-track{background:var(--bg2);border-radius:2px}
.kanban::-webkit-scrollbar-thumb{background:var(--bor2);border-radius:2px}
.kcol{background:var(--bg2);border-radius:var(--r);padding:.85rem;min-width:240px;flex-shrink:0;max-width:280px}
.kcol-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
.kcol-title{display:flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.kcol-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.kcol-count{font-size:.65rem;font-weight:700;padding:.1rem .35rem;border-radius:100px;background:var(--bg3);color:var(--tm)}
.kcard{
  background:var(--card);border:1px solid var(--bor);border-radius:var(--r2);
  padding:.85rem;margin-bottom:.5rem;cursor:pointer;transition:all .18s;
}
.kcard:hover{border-color:var(--bor2);transform:translateY(-1px);box-shadow:var(--sh)}
.kcard:last-of-type{margin-bottom:0}
.kcard-title{font-size:.82rem;font-weight:600;color:var(--t1);margin-bottom:.3rem;line-height:1.35}
.kcard-client{font-size:.72rem;color:var(--t2);margin-bottom:.5rem}
.kcard-foot{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.kcard-date{font-family:var(--mono);font-size:.65rem;color:var(--tm)}
.add-col-btn{
  width:100%;padding:.5rem;border:1.5px dashed var(--bor);border-radius:var(--r2);
  background:transparent;color:var(--tm);font-family:var(--font);font-size:.75rem;
  cursor:pointer;transition:all .2s;margin-top:.5rem;
}
.add-col-btn:hover{border-color:var(--blue);color:var(--blue)}
.pbar-wrap{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:.5rem}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-l));border-radius:2px}

/* ── FINANCES / MENSALIDADES ── */
.fin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.fin-card{background:var(--card);border:1px solid var(--bor);border-radius:var(--r);padding:1.2rem}
.fin-card h3{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);margin-bottom:.6rem}
.fin-val{font-size:1.7rem;font-weight:700;letter-spacing:-.05em;line-height:1}
.fin-val.gr{color:var(--green)}.fin-val.bl{color:var(--blue)}.fin-val.am{color:var(--amber)}.fin-val.pu{color:var(--purple)}.fin-val.cy{color:var(--cyan)}
.fin-sub{font-size:.72rem;color:var(--t2);margin-top:.3rem}
.bar-chart{display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem}
.bar-row{display:flex;align-items:center;gap:.6rem;font-size:.72rem}
.bar-label{color:var(--t2);width:90px;flex-shrink:0;font-weight:500;font-size:.7rem}
.bar-track{flex:1;height:7px;background:var(--bg2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--blue-l));transition:width .8s}
.bar-val{font-family:var(--mono);font-size:.65rem;color:var(--tm);width:65px;text-align:right;flex-shrink:0}

/* ── MONTHLY TAB ── */
.month-head{display:grid;grid-template-columns:1fr auto auto auto;gap:.75rem;align-items:center;padding:.65rem 1rem;border-bottom:1px solid var(--bor);font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tm)}
.month-row{
  display:grid;grid-template-columns:1fr auto auto auto;gap:.75rem;align-items:center;
  padding:.7rem 1rem;border-bottom:1px solid var(--bor);cursor:pointer;transition:background .15s;
}
.month-row:last-child{border-bottom:none}
.month-row:hover{background:var(--bg2)}
.month-status-btn{
  padding:.25rem .6rem;border-radius:100px;font-size:.65rem;font-weight:700;
  cursor:pointer;border:none;font-family:var(--font);transition:all .2s;
}
.ms-pending{background:rgba(245,158,11,.15);color:var(--amber)}
.ms-pending:hover{background:var(--amber);color:#fff}
.ms-paid{background:rgba(16,185,129,.15);color:var(--green)}
.ms-paid:hover{background:rgba(16,185,129,.25)}
.ms-overdue{background:rgba(239,68,68,.15);color:var(--red)}
.ms-overdue:hover{background:var(--red);color:#fff}
.month-val{font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--t1)}
.month-date{font-family:var(--mono);font-size:.7rem;color:var(--tm)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--bor2);border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.7);animation:mIn .22s cubic-bezier(.4,0,.2,1)}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
.modal-h{padding:1.25rem 1.5rem 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:.95rem;font-weight:700;color:var(--t1);letter-spacing:-.02em}
.modal-x{width:28px;height:28px;border-radius:var(--r2);border:none;background:var(--bg2);color:var(--t2);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-x:hover{background:var(--red-p);color:var(--red)}
.modal-b{padding:1.25rem 1.5rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.fg{display:flex;flex-direction:column;gap:.35rem}
.fg.s2{grid-column:1/-1}
.flabel{font-size:.72rem;font-weight:600;color:var(--t2);letter-spacing:.02em}
.finp{padding:.55rem .85rem;background:var(--bg);border:1.5px solid var(--bor2);border-radius:var(--r2);color:var(--t1);font-family:var(--font);font-size:.85rem;outline:none;transition:all .2s;width:100%}
.finp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,50,204,.12)}
.finp::placeholder{color:var(--tm)}
textarea.finp{min-height:80px;resize:vertical}
.modal-f{padding:.75rem 1.5rem 1.25rem;display:flex;gap:.6rem;justify-content:flex-end}

/* ── DETAIL PANEL ── */
.dpanel-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:none;backdrop-filter:blur(2px)}
.dpanel-ov.open{display:block}
.dpanel{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;background:var(--card);border-left:1px solid var(--bor);z-index:151;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.dpanel-ov.open .dpanel{transform:translateX(0)}
.dp-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--bor);display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;position:sticky;top:0;background:var(--card);z-index:1}
.dp-body{padding:1.25rem}
.dp-sec{margin-bottom:1.5rem}
.dp-sec-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);margin-bottom:.65rem}
.dp-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--bor);gap:.75rem}
.dp-row:last-child{border-bottom:none}
.dp-key{font-size:.78rem;color:var(--t2);font-weight:500}
.dp-val{font-size:.82rem;color:var(--t1);font-weight:600;text-align:right}
.dp-notes{background:var(--bg2);border-radius:var(--r2);padding:.85rem;font-size:.82rem;color:var(--t2);line-height:1.65}
.pbar-big{background:var(--bg2);border-radius:3px;height:6px;overflow:hidden}
.pbar-big-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-l));border-radius:3px;transition:width .6s}

/* ── EMPTY ── */
.empty{text-align:center;padding:3rem 1.5rem}
.empty-ico{font-size:2.5rem;margin-bottom:.85rem;opacity:.5}
.empty-title{font-size:.9rem;font-weight:600;color:var(--t2);margin-bottom:.35rem}
.empty-desc{font-size:.78rem;color:var(--tm);margin-bottom:1.25rem}

/* ── TOAST ── */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:300;background:var(--card);border:1px solid var(--bor2);border-radius:var(--r);padding:.75rem 1.1rem;box-shadow:var(--sh2);font-size:.82rem;font-weight:500;color:var(--t1);display:flex;align-items:center;gap:.5rem;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;max-width:280px}
#toast.show{transform:translateY(0);opacity:1}

/* ── MOBILE ── */
@media(max-width:768px){
  :root{--sb:260px}
  .sidebar{
    position:fixed;top:var(--top);left:0;bottom:0;z-index:90;
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block;position:fixed;top:var(--top);inset:0;z-index:89}
  .layout{flex-direction:column}
  .content{padding:1rem .85rem;width:100%}
  .stats-grid{grid-template-columns:1fr 1fr}
  .fin-grid{grid-template-columns:1fr 1fr}
  .stat-val{font-size:1.5rem}
  .fin-val{font-size:1.4rem}
  .kanban{padding-bottom:1rem}
  .fgrid{grid-template-columns:1fr}
  .fg.s2{grid-column:1}
  th:nth-child(n+4),td:nth-child(n+4){display:none}
  .dpanel{width:100vw}
  .filters{flex-direction:column}
  .finput-search{min-width:100%}
}
@media(max-width:380px){
  .stats-grid{grid-template-columns:1fr}
  .fin-grid{grid-template-columns:1fr}
}
</style>

const PK='vtr_proj_v3', MK='vtr_month_v1';
const loadP=()=>{try{return JSON.parse(localStorage.getItem(PK))||[]}catch{return[]}};
const loadM=()=>{try{return JSON.parse(localStorage.getItem(MK))||[]}catch{return[]}};
const saveP=d=>localStorage.setItem(PK,JSON.stringify(d));
const saveM=d=>localStorage.setItem(MK,JSON.stringify(d));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);

// ── LOOKUPS ──
const SVC_LABEL={site:'Dev de Site',landing:'Dev de Landing',social:'Gestão de Redes',email:'Disparo em Massa',ecom:'Config. E-commerce',monthly:'Mensalidade'};
const SVC_CLASS={site:'sv-site',landing:'sv-landing',social:'sv-social',email:'sv-email',ecom:'sv-ecom',monthly:'sv-month'};
const ST_LABEL={lead:'Lead',active:'Em andamento',review:'Em revisão',done:'Concluído',paused:'Pausado'};
const ST_CLS={lead:'b-lead',active:'b-active',review:'b-review',done:'b-done',paused:'b-paused'};
const PR_CLS={high:'p-h',medium:'p-m',low:'p-l'};
const PR_LABEL={high:'Alta',medium:'Média',low:'Baixa'};
const COL_ORDER=['lead','active','review','done'];
const COL_LABEL={lead:'Lead',active:'Em andamento',review:'Em revisão',done:'Concluído'};
const COL_CLR={lead:'#6b7280',active:'var(--green)',review:'var(--amber)',done:'var(--blue)'};
const MN_CLS={pending:'ms-pending',paid:'ms-paid',overdue:'ms-overdue'};
const MN_LABEL={pending:'A receber',paid:'Pago',overdue:'Em atraso'};

const fmt=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtDate=d=>{if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`};
const deadWarn=d=>{if(!d)return'';const diff=Math.ceil((new Date(d)-new Date())/86400000);if(diff<0)return' <span style="color:var(--red);font-size:.65rem">⚠ vencido</span>';if(diff<=7)return` <span style="color:var(--amber);font-size:.65rem">⏰${diff}d</span>`;return''};

// ── TOAST ──
function toast(msg,ico='✅'){
  document.getElementById('toastMsg').textContent=msg;
  document.getElementById('toastIco').textContent=ico;
  const t=document.getElementById('toast');
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);
}

// ── NAV ──
let curPage='dash';
function navigate(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll(`[data-page="${page}"]`).forEach(n=>n.classList.add('active'));
  const titles={dash:'Dashboard',kanban:'Kanban',projects:'Projetos',monthly:'Mensalidades',finances:'Financeiro'};
  document.getElementById('ptitle').textContent=titles[page]||page;
  curPage=page;
  renderPage(page);
  // close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sideOv').classList.remove('open');
  document.getElementById('ham').classList.remove('open');
}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.getAttribute('data-page'))));

function renderPage(p){
  updateBadges();
  if(p==='dash') renderDash();
  if(p==='kanban') renderKanban();
  if(p==='projects') renderTable();
  if(p==='monthly') renderMonthly();
  if(p==='finances') renderFinances();
}

function updateBadges(){
  const pr=loadP(),mn=loadM();
  document.getElementById('kb-badge').textContent=pr.filter(p=>p.status!=='done').length;
  document.getElementById('pj-badge').textContent=pr.length;
  document.getElementById('mn-badge').textContent=mn.filter(m=>m.status==='pending'||m.status==='overdue').length;
}

// ── DASHBOARD ──

  const pr=loadP(),mn=loadM();
  const active=pr.filter(p=>p.status==='active');
  const done=pr.filter(p=>p.status==='done');
  const mnMRR=mn.reduce((a,m)=>a+Number(m.value||0),0);
  const projVal=pr.reduce((a,p)=>a+Number(p.value||0),0);
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card">
      <div class="stat-label">Projetos ativos</div>
      <div class="stat-val">${active.length}</div>
      <div class="stat-sub">${pr.length} no total</div>
      <div class="stat-ico" style="background:rgba(26,50,204,.12)"><svg fill="none" stroke="var(--blue)" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">MRR (mensalidades)</div>
      <div class="stat-val" style="font-size:1.4rem">${fmt(mnMRR)}</div>
      <div class="stat-sub">${mn.length} cliente${mn.length!==1?'s':''} recorrente${mn.length!==1?'s':''}</div>
      <div class="stat-ico" style="background:rgba(6,182,212,.12)"><svg fill="none" stroke="var(--cyan)" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Receita projetos</div>
      <div class="stat-val" style="font-size:1.4rem">${fmt(projVal)}</div>
      <div class="stat-sub">${done.length} concluído${done.length!==1?'s':''}</div>
      <div class="stat-ico" style="background:rgba(16,185,129,.12)"><svg fill="none" stroke="var(--green)" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">A receber este mês</div>
      <div class="stat-val" style="font-size:1.4rem">${fmt(mn.filter(m=>m.status==='pending').reduce((a,m)=>a+Number(m.value||0),0))}</div>
      <div class="stat-sub">${mn.filter(m=>m.status==='overdue').length} em atraso</div>
      <div class="stat-ico" style="background:rgba(245,158,11,.12)"><svg fill="none" stroke="var(--amber)" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
    </div>`;

  const recent=[...pr].filter(p=>p.status!=='done').sort((a,b)=>new Date(b.created)-new Date(a.created)).slice(0,6);
  if(!recent.length){
    document.getElementById('dashList').innerHTML=`<div class="empty" style="background:var(--card);border:1px solid var(--bor);border-radius:var(--r)"><div class="empty-ico">🚀</div><div class="empty-title">Tudo pronto pra começar</div><div class="empty-desc">Crie seu primeiro projeto ou mensalidade</div><button class="btn btn-primary" onclick="openModal()">+ Criar projeto</button></div>`;
    return;
  }
  document.getElementById('dashList').innerHTML=`<div class="table-wrap"><table>
    <thead><tr><th>Projeto / Cliente</th><th>Serviço</th><th>Status</th><th>Progresso</th><th>Prazo</th></tr></thead>
    <tbody>${recent.map(p=>`<tr onclick="openDetail('${p.id}')">
      <td><div class="td-main">${p.name}</div><div class="td-sub">${p.client}</div></td>
      <td><span class="svc-badge ${SVC_CLASS[p.service]}">${SVC_LABEL[p.service]}</span></td>
      <td><span class="badge ${ST_CLS[p.status]}">${ST_LABEL[p.status]}</span></td>
      <td><div style="display:flex;align-items:center;gap:.4rem"><div class="pbar-wrap" style="flex:1;max-width:70px"><div class="pbar-fill" style="width:${p.progress||0}%"></div></div><span style="font-size:.68rem;color:var(--tm);font-family:var(--mono)">${p.progress||0}%</span></div></td>
      <td><span class="td-muted">${fmtDate(p.deadline)}</span>${deadWarn(p.deadline)}</td>

// ── KANBAN ──
function renderKanban(){
  const pr=loadP();
  document.getElementById('kanbanBoard').innerHTML=COL_ORDER.map(col=>{
    const cards=pr.filter(p=>p.status===col);
    return`<div class="kcol">
      <div class="kcol-head">
        <div class="kcol-title"><span class="kcol-dot" style="background:${COL_CLR[col]}"></span>${COL_LABEL[col]}</div>
        <span class="kcol-count">${cards.length}</span>
      </div>
      ${cards.map(p=>`<div class="kcard" onclick="openDetail('${p.id}')">
        <div class="kcard-title">${p.name}</div>
        <div class="kcard-client">${p.client}</div>
        <div class="kcard-foot">
          <span class="svc-badge ${SVC_CLASS[p.service]}">${SVC_LABEL[p.service]}</span>
          <div style="display:flex;align-items:center;gap:.35rem"><span class="pdot ${PR_CLS[p.priority]}"></span><span class="kcard-date">${fmtDate(p.deadline)}</span></div>
        </div>
        ${p.progress?`<div class="pbar-wrap"><div class="pbar-fill" style="width:${p.progress}%"></div></div>`:''}
      </div>`).join('')}
      ${!cards.length?`<div style="text-align:center;padding:1.5rem .5rem;color:var(--tm);font-size:.75rem">Sem projetos</div>`:''}
      <button class="add-col-btn" onclick="openModal(null,'${col}')">+ Adicionar</button>
    </div>`;
  }).join('');
}

// ── TABLE ──
function renderTable(){
  const q=document.getElementById('searchInp').value.toLowerCase();
  const fst=document.getElementById('filtSt').value;
  const fsv=document.getElementById('filtSv').value;
  let pr=loadP();
  if(q) pr=pr.filter(p=>p.name.toLowerCase().includes(q)||p.client.toLowerCase().includes(q));
  if(fst) pr=pr.filter(p=>p.status===fst);
  if(fsv) pr=pr.filter(p=>p.service===fsv);
  const tb=document.getElementById('projTable');
  if(!pr.length){tb.innerHTML=`<tr><td colspan="7"><div class="empty"><div class="empty-ico">🔍</div><div class="empty-title">Nenhum resultado</div></div></td></tr>`;return}
  tb.innerHTML=pr.map(p=>`<tr onclick="openDetail('${p.id}')">
    <td><div class="td-main">${p.name}</div><div class="td-sub">${p.client}</div></td>
    <td><span class="svc-badge ${SVC_CLASS[p.service]}">${SVC_LABEL[p.service]}</span></td>
    <td><span class="badge ${ST_CLS[p.status]}">${ST_LABEL[p.status]}</span></td>
    <td><span class="td-mono">${fmt(p.value)}</span></td>
    <td><span class="td-muted">${fmtDate(p.deadline)}</span>${deadWarn(p.deadline)}</td>
    <td><div style="display:flex;align-items:center;gap:.4rem"><div class="pbar-wrap" style="width:55px"><div class="pbar-fill" style="width:${p.progress||0}%"></div></div><span style="font-size:.65rem;color:var(--tm);font-family:var(--mono)">${p.progress||0}%</span></div></td>
    <td onclick="event.stopPropagation()"><div class="row-act">
      <button class="btn btn-ghost btn-sm" onclick="openModal('${p.id}')">✏️</button>
      <button class="btn btn-danger btn-sm" onclick="delProj('${p.id}')">🗑</button>
    </div></td>
  </tr>`).join('');
}
document.getElementById('searchInp').addEventListener('input',renderTable);
document.getElementById('filtSt').addEventListener('change',renderTable);
document.getElementById('filtSv').addEventListener('change',renderTable);

// ── MENSALIDADES ──
function renderMonthly(){
  const mn=loadM();
  const paid=mn.filter(m=>m.status==='paid').reduce((a,m)=>a+Number(m.value||0),0);
  const pending=mn.filter(m=>m.status==='pending').reduce((a,m)=>a+Number(m.value||0),0);
  const overdue=mn.filter(m=>m.status==='overdue').reduce((a,m)=>a+Number(m.value||0),0);
  document.getElementById('mnStats').innerHTML=`
    <div class="stat-card"><div class="stat-label">MRR total</div><div class="stat-val cy" style="font-size:1.5rem">${fmt(mn.reduce((a,m)=>a+Number(m.value||0),0))}</div><div class="stat-sub">${mn.length} clientes</div></div>
    <div class="stat-card"><div class="stat-label">Recebido</div><div class="stat-val gr" style="font-size:1.5rem">${fmt(paid)}</div><div class="stat-sub">${mn.filter(m=>m.status==='paid').length} pagos</div></div>
    <div class="stat-card"><div class="stat-label">A receber</div><div class="stat-val am" style="font-size:1.5rem">${fmt(pending)}</div><div class="stat-sub">${mn.filter(m=>m.status==='pending').length} pendentes</div></div>
    <div class="stat-card"><div class="stat-label">Em atraso</div><div class="stat-val" style="color:var(--red);font-size:1.5rem">${fmt(overdue)}</div><div class="stat-sub">${mn.filter(m=>m.status==='overdue').length} atrasados</div></div>`;

  if(!mn.length){
    document.getElementById('mnTable').innerHTML=`<div class="empty"><div class="empty-ico">📅</div><div class="empty-title">Nenhuma mensalidade</div><div class="empty-desc">Adicione clientes recorrentes para acompanhar o MRR</div></div>`;
    return;
  }
  const sorted=[...mn].sort((a,b)=>{const o={overdue:0,pending:1,paid:2};return(o[a.status]??3)-(o[b.status]??3)});
  document.getElementById('mnTable').innerHTML=`<div class="table-wrap">
    <div class="month-head"><div>Cliente / Serviço</div><div>Vencimento</div><div>Valor</div><div>Status</div></div>
    ${sorted.map(m=>`<div class="month-row" onclick="openDetailMn('${m.id}')">
      <div><div class="td-main">${m.client}</div><div class="td-sub"><span class="svc-badge ${SVC_CLASS[m.service]||'sv-month'}">${SVC_LABEL[m.service]||'Mensalidade'}</span></div></div>
      <div class="month-date">Dia ${m.day||'—'}</div>
      <div class="month-val">${fmt(m.value)}</div>
      <div onclick="event.stopPropagation()">
        <button class="month-status-btn ${MN_CLS[m.status]}" onclick="cycleMnStatus('${m.id}')">${MN_LABEL[m.status]}</button>
      </div>
    </div>`).join('')}
  </div>`;
}

function cycleMnStatus(id){
  const mn=loadM(), m=mn.find(x=>x.id===id);
  if(!m) return;
  const cycle={pending:'paid',paid:'overdue',overdue:'pending'};
  m.status=cycle[m.status]||'pending';
  saveM(mn); renderMonthly(); updateBadges();
  toast(`Status: ${MN_LABEL[m.status]}`,'🔄');
}

// ── FINANCES ──
function renderFinances(){
  const pr=loadP(), mn=loadM();
  const total=pr.reduce((a,p)=>a+Number(p.value||0),0);
  const mrr=mn.reduce((a,m)=>a+Number(m.value||0),0);
  const recv=pr.filter(p=>p.status!=='done').reduce((a,p)=>a+Number(p.value||0),0);
  const avg=pr.length?total/pr.length:0;
  document.getElementById('finStats').innerHTML=`
    <div class="fin-card"><h3>Receita projetos</h3><div class="fin-val gr">${fmt(total)}</div><div class="fin-sub">${pr.filter(p=>p.status==='done').length} concluídos</div></div>
    <div class="fin-card"><h3>MRR mensalidades</h3><div class="fin-val cy">${fmt(mrr)}</div><div class="fin-sub">${mn.length} clientes recorrentes</div></div>
    <div class="fin-card"><h3>A receber (projetos)</h3><div class="fin-val am">${fmt(recv)}</div><div class="fin-sub">${pr.filter(p=>p.status!=='done').length} em aberto</div></div>
    <div class="fin-card"><h3>Receita total</h3><div class="fin-val bl">${fmt(total+mrr)}</div><div class="fin-sub">projetos + MRR</div></div>
    <div class="fin-card"><h3>Ticket médio</h3><div class="fin-val">${fmt(avg)}</div><div class="fin-sub">por projeto</div></div>
    <div class="fin-card"><h3>Projetos ativos</h3><div class="fin-val" style="color:var(--purple)">${pr.filter(p=>p.status==='active').length}</div><div class="fin-sub">em andamento</div></div>`;

  const bySvc={};
  pr.forEach(p=>{bySvc[p.service]=(bySvc[p.service]||0)+Number(p.value||0)});
  const maxV=Math.max(...Object.values(bySvc),1);
  document.getElementById('finChart').innerHTML=Object.entries(bySvc).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`
    <div class="bar-row">
      <span class="bar-label">${SVC_LABEL[s]||s}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${v/maxV*100}%"></div></div>
      <span class="bar-val">${fmt(v)}</span>
    </div>`).join('');

  document.getElementById('finTable').innerHTML=[...pr].sort((a,b)=>Number(b.value||0)-Number(a.value||0)).map(p=>`
    <tr onclick="openDetail('${p.id}')">
      <td><div class="td-main">${p.name}</div></td>
      <td><div class="td-sub">${p.client}</div></td>
      <td><span class="td-mono">${fmt(p.value)}</span></td>
      <td><span class="badge ${ST_CLS[p.status]}">${ST_LABEL[p.status]}</span></td>
      <td><span class="td-muted">${fmtDate(p.deadline)}</span></td>
    </tr>`).join('');
}

// ── DETAIL ──

  detId=id;
  const p=loadP().find(x=>x.id===id);
  if(!p) return;
  document.getElementById('dpTitle').textContent=p.name;
  document.getElementById('dpSub').textContent=p.client;
  document.getElementById('dpBody').innerHTML=`
    <div class="dp-sec">
      <div class="dp-sec-label">Informações</div>
      <div class="dp-row"><span class="dp-key">Serviço</span><span class="dp-val"><span class="svc-badge ${SVC_CLASS[p.service]}">${SVC_LABEL[p.service]}</span></span></div>
      <div class="dp-row"><span class="dp-key">Status</span><span class="dp-val"><span class="badge ${ST_CLS[p.status]}">${ST_LABEL[p.status]}</span></span></div>
      <div class="dp-row"><span class="dp-key">Prioridade</span><span class="dp-val" style="display:flex;align-items:center;gap:.35rem;justify-content:flex-end"><span class="pdot ${PR_CLS[p.priority]}"></span>${PR_LABEL[p.priority]}</span></div>
      <div class="dp-row"><span class="dp-key">Valor</span><span class="dp-val">${fmt(p.value)}</span></div>
      <div class="dp-row"><span class="dp-key">Prazo</span><span class="dp-val">${fmtDate(p.deadline)}${deadWarn(p.deadline)}</span></div>
      ${p.contact?`<div class="dp-row"><span class="dp-key">Contato</span><span class="dp-val" style="font-size:.76rem">${p.contact}</span></div>`:''}
    </div>
    <div class="dp-sec">
      <div class="dp-sec-label">Progresso — ${p.progress||0}%</div>
      <div class="pbar-big"><div class="pbar-big-fill" style="width:${p.progress||0}%"></div></div>
    </div>
    ${p.notes?`<div class="dp-sec"><div class="dp-sec-label">Observações</div><div class="dp-notes">${p.notes}</div></div>`:''}

    </div>`;
  document.getElementById('dpOv').classList.add('open');

function openDetailMn(id){
  const m=loadM().find(x=>x.id===id);
  if(!m) return;
  detId=null;
  document.getElementById('dpTitle').textContent=m.client;
  document.getElementById('dpSub').textContent='Mensalidade recorrente';
  document.getElementById('dpBody').innerHTML=`
    <div class="dp-sec">
      <div class="dp-sec-label">Detalhes</div>
      <div class="dp-row"><span class="dp-key">Serviço</span><span class="dp-val"><span class="svc-badge ${SVC_CLASS[m.service]||'sv-month'}">${SVC_LABEL[m.service]||'Mensalidade'}</span></span></div>
      <div class="dp-row"><span class="dp-key">Valor mensal</span><span class="dp-val">${fmt(m.value)}</span></div>
      <div class="dp-row"><span class="dp-key">Vencimento</span><span class="dp-val">Todo dia ${m.day||'—'}</span></div>
      <div class="dp-row"><span class="dp-key">Status</span><span class="dp-val"><button class="month-status-btn ${MN_CLS[m.status]}" onclick="cycleMnStatus('${m.id}');openDetailMn('${m.id}')">${MN_LABEL[m.status]} (clique para alterar)</button></span></div>
      ${m.contact?`<div class="dp-row"><span class="dp-key">Contato</span><span class="dp-val" style="font-size:.76rem">${m.contact}</span></div>`:''}
    </div>
    ${m.notes?`<div class="dp-sec"><div class="dp-sec-label">Observações</div><div class="dp-notes">${m.notes}</div></div>`:''}
    <div style="display:flex;gap:.4rem;margin-top:.5rem">
      <button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="openMnModal('${m.id}')">✏️ Editar</button>
      <button class="btn btn-danger btn-sm" style="flex:1;justify-content:center" onclick="delMn('${m.id}')">🗑 Excluir</button>
    </div>`;
  document.getElementById('dpEdit').style.display='none';
  document.getElementById('dpOv').classList.add('open');
}

function quickSt(id,st){
  const pr=loadP(),p=pr.find(x=>x.id===id);
  if(!p) return;
  p.status=st; saveP(pr);
  openDetail(id); renderPage(curPage);
  toast(`Movido para "${ST_LABEL[st]}"`,'🔄');
}

document.getElementById('dpClose').addEventListener('click',()=>{document.getElementById('dpOv').classList.remove('open');document.getElementById('dpEdit').style.display=''});
document.getElementById('dpOv').addEventListener('click',e=>{if(e.target===e.currentTarget){e.currentTarget.classList.remove('open');document.getElementById('dpEdit').style.display=''}});
document.getElementById('dpEdit').addEventListener('click',()=>{document.getElementById('dpOv').classList.remove('open');document.getElementById('dpEdit').style.display='';if(detId)openModal(detId)});

// ── MODAL PROJETO ──
let editId=null;
function openModal(id=null,defaultSt='active'){
  editId=id;
  const p=id?loadP().find(x=>x.id===id):null;
  document.getElementById('modalTitle').textContent=p?'Editar Projeto':'Novo Projeto';

  document.getElementById('dpOv').classList.remove('open');

}

// ── EXPORT / IMPORT ──
function exportData(){
  const pr=loadP(),mn=loadM();
  const blob=new Blob([JSON.stringify({projects:pr,monthly:mn},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`vetra-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast(`Backup exportado (${pr.length+mn.length} itens)`,'💾');
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!confirm(`Importar ${(d.projects?.length||0)} projetos e ${(d.monthly?.length||0)} mensalidades? Dados atuais serão substituídos.`)) return;
      if(d.projects) saveP(d.projects);
      if(d.monthly) saveM(d.monthly);
      renderPage(curPage); toast('Dados importados!','📂');
    }catch{toast('Arquivo inválido','❌')}
  };
  reader.readAsText(file); e.target.value='';
}
